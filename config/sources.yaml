# Configuração das fontes monitoradas pelo Pedido 01.
#
# Cada fonte é um dicionário com:
#   id:          identificador único e estável (usado para dedup/histórico — não mudar depois de criado)
#   nome:        nome legível da fonte
#   categoria:   nacional_extrajudicial | legislativo | estadual_anoreg | estadual_tj | estadual_corregedoria
#   estado:      sigla UF (só para categorias estaduais; ausente para nacionais)
#   url:         página institucional de referência (mantida mesmo quando a coleta usa
#                "endpoint" — é o link mostrado a um humano que queira abrir a fonte)
#   ativo:       true/false — false = pendente de confirmação manual antes de ativar
#   modo:        "estatico" (requests/BeautifulSoup) | "js" (Playwright) |
#                "api_json" (endpoint JSON — ver "endpoint"/"formato" abaixo)
#   endpoint:    só para modo=api_json — URL do endpoint JSON a consultar (em vez de "url")
#   formato:     só para modo=api_json — "wp" (padrão; coleção WordPress REST, ex.:
#                wp/v2/posts ou um Custom Post Type como wp/v2/legislacao — ainda passa
#                pelo Claude via extract.py para julgar relevância) | "cnj_atos"
#                (endpoint dedicado do CNJ — já é ato oficial estruturado, pula o Claude)
#   nota:        observação da pesquisa automatizada (bloqueio, erro, ambiguidade) — ver
#                também o documento de validação gerado para a equipe jurídica.
#
# Sobre modo=api_json: confirmado por teste real em 18/08/2026 para 20 das 87 fontes
# (ver nota técnica "Rotas de Coleta"). Importante — o discovery root /wp-json/ responder
# 200 NÃO garante que a rota de dados (wp/v2/posts) funcione: vários TJs respondem 200
# no root mas servem HTML normal (não JSON) em wp/v2/posts, provavelmente por
# endurecimento de segurança que desabilita a rota de conteúdo. Só as 20 fontes abaixo
# tiveram o endpoint de dados testado e confirmado — não replicar o padrão para outras
# fontes sem antes testar wp-json/wp/v2/posts (ou o CPT específico) diretamente.
#
# Gerado por scripts/gerar_sources_yaml.py a partir da pesquisa registrada em
# TODO_FONTES_ESTADUAIS.md. Todas as fontes com ativo:false precisam de confirmação
# manual (ver doc de validação) antes de entrarem no ciclo de produção.

fontes:
- id: cnj
  nome: CNJ — Conselho Nacional de Justiça
  categoria: nacional_extrajudicial
  url: https://atos.cnj.jus.br/atos
  ativo: true
  modo: api_json
  formato: cnj_atos
  endpoint: https://atos.cnj.jus.br/api/atos
  nota: Endpoint interno da SPA de busca de atos normativos (Provimento, Portaria etc.), não documentado
    publicamente mas confirmado por request real em 18/08/2026 — devolve ato oficial estruturado
    (tipo, número, data, situação, ementa, inteiro teor). Substitui a antiga fonte por scraping da
    página de notícias, que só captava menções a atos, não os atos em si.
